# Trading Bot v1 Configuration

mode: paper  # paper | live (changing to live also requires TRADING_LIVE_ACK=I_UNDERSTAND env var)

exchange:
  name: binanceus
  pairs:
    - BTC/USDT
    - ETH/USDT
    - SOL/USDT
  fees:
    maker: 0.001   # 0.10%
    taker: 0.001   # 0.10%
  slippage:
    market: 0.0005  # 0.05% adverse
    limit: 0.0      # limit fills at the price

# ---------------------------------------------------------------------------
# COST PROFILES BY VENUE / ASSET CLASS  (added 2026-08-13)
#
# WHY: the harness applied ONE cost model - Binance.US crypto taker fees -
# to every instrument, including 905,124 equity trades. Alpaca charges $0
# commission on equities, so those runs were charged roughly 6-15x the real
# cost. The gross-edge-is-zero verdict survives this (gross was ~0 in every
# class), but the BAR for future work differs by class by an order of
# magnitude, so the model must stop pretending they are the same.
#
# STATUS: WIRED 2026-08-13 (D-235) via backtest/cost_model.py, which is the
# single source of truth for rates - the profiles below are documentation.
# Harnesses use venue-accurate costs only when `use_cost_model: true` is set
# (the graveyard runner forces it); otherwise they run the legacy flat
# exchange.fees model, bit-identical to before, which the cross-harness
# referee requires. Every result row is stamped `cost_model_version`, and
# results with different stamps can never be pooled (backtest/assertions.py).
#
# UNVERIFIED: the binanceus rates below are the SPEC's original assumption.
# Two reviewers report Binance.US moved to 0% maker / 0.02% taker in April
# 2026; ccxt's public data still reports 0.10% (possibly its static default).
# Account-specific rates need an authenticated call. AYM TO VERIFY.
# ---------------------------------------------------------------------------
cost_profiles:
  binanceus_crypto:
    maker: 0.001          # 0.10% - UNVERIFIED, may now be 0.0
    taker: 0.001          # 0.10% - UNVERIFIED, may now be 0.0002
    slippage_market: 0.0005
    model: percentage
  alpaca_equity:
    maker: 0.0            # commission-free
    taker: 0.0            # commission-free
    slippage_market: 0.0002   # spread-driven, ~2bps round trip on liquid names
    model: percentage_spread_only
  futures_per_contract:
    commission_per_contract: 2.50   # round turn, typical retail
    model: fixed_per_contract
    # WARNING: a single ES contract is ~$250k notional. The $100 fixed-notional
    # model CANNOT trade futures. All 79,642 futures backtest rows are
    # structurally fictional and must be re-scoped to micro contracts (MES/MNQ)
    # or dropped from the tradeable universe.
  options_per_contract:
    commission_per_contract: 0.65
    model: fixed_per_contract
    # Fixed cost INVERTS the size logic (see research/2026-08-13-position-size-and-costs.md)

# Venue-accurate backtest costs (backtest/cost_model.py). False = legacy flat
# exchange.fees model. The graveyard runner overrides this to true in code.
use_cost_model: false

timeframes:
  signal: 15m
  regime: 1h

strategy:
  patterns:
    - bullish_engulfing
    - hammer
    - morning_star
    - piercing_line
    - three_white_soldiers
    - bearish_exit
    - doji_filter
  confirmation:
    regime_ema_period: 50
    regime_lookback: 10
    rsi_period: 14
    rsi_max_entry: 60
    rsi_reversal_boost: 45
    volume_sma_period: 20
    volume_min_ratio: 1.5
    support_lookback: 100
    support_min_touches: 2
    support_cluster_atr_mult: 0.5
    location_atr_mult: 1.5
    spread_max: 0.001  # 0.10%

risk:
  notional_cap_usd: 100          # FIXED notional cap per trade. Does NOT scale with balance.
  fee_to_edge_max: 0.15         # reject trade if fee / (entry - stop) > this (15% of edge eaten by fees)
  max_trades_per_day: 1         # F4/R6: start at 1, tune up when profitable
  consecutive_loss_pause: 4     # 4 losing trades in a row = 24h pause on new entries
  daily_ops_stop_multiplier: 3  # equity drop > 3x notional_cap in a day = halt (ops backstop)
  weekly_ops_stop_multiplier: 15 # equity drop > 15x notional_cap in a week = halt (ops backstop)
  max_concurrent_positions: 2
  max_positions_per_pair: 1
  atr_period: 14
  atr_stop_mult: 0.25           # stop = signal low - 0.25 * ATR
  target_r: 2.0                 # 2R target

paper:
  starting_equity: 2000.0
  currency: USDT

# ---------------------------------------------------------------------------
# POLYMARKET BINARY OUTCOME MARKETS (D-267)
#
# PAPER ONLY. There is no live execution path in engine/polymarket/, and
# PolymarketRiskGate.check_order refuses any mode other than 'paper'.
#
# WHY THESE ARE HERE: every value below was a hardcoded DEFAULT_* constant in
# engine/polymarket/risk_gate.py. Convention 17 - a hardcoded threshold is an
# assumption with an expiry date - and an assumption nobody can see in the
# config is one nobody reviews. Each key is set to the module's CURRENT
# default, so adding this block changes no behaviour.
# tests/test_polymarket_risk_gate.py asserts this block and the module
# defaults still agree, so drift in either direction fails loudly.
#
# Deleting a key falls back to the DEFAULT_* constant in the module.
#
# EXPIRY on all of it: none of these numbers are derived from our own data.
# D-268 says every Polymarket strategy is NOT_TESTED until the resolution-PnL
# harness exists. Raise a cap only after a strategy clears the 30bps net kill
# line, and record it as a decision with a D-number.
# ---------------------------------------------------------------------------
polymarket:
  # -- paper adapter (engine/polymarket/paper_adapter.py) --
  starting_equity_usdc: 2000.0   # simulated USDC bankroll; also Kelly's default bankroll
  taker_fee_rate: 0.0            # Polymarket charges no CLOB taker fee TODAY. An assumption, not a law.
  notional_cap_usdc: 10.0        # adapter's own per-order premium cap
  max_concurrent_positions: 10   # adapter's own open-position cap (D-321: raised 5->10, shadow only)
  min_shares: 5                  # exchange minimum order size, in shares
  price_tick: 0.01               # CLOB price increment

  # -- strike proxy noise floor (engine/polymarket/strike.py) --
  # The gate is `abs(lead_bps) < floor -> skip`, so a BIGGER number here
  # rejects MORE windows and a SMALLER one admits more. Deleting a key falls
  # back to NOISE_FLOOR_BPS_BY_ASSET, then to STRIKE_PROXY_NOISE_FLOOR_BPS.
  #
  # Lowered from 5.0 to 1.0 for shadow mode on 2026-08-18. Measured from the
  # 10,276 rows this gate has actually rejected: at 5.0 it admitted 0.0% of
  # them, at 1.0 it admits 50.8% on btc and 56.6% on eth. 1.0 is the lowest
  # floor still OUTSIDE the measured coin-flip band - below 1 bp the proxy
  # disagrees with the oracle 42.2% of the time, so firing there samples a
  # random number generator rather than testing a strategy (convention 11).
  #
  # sol is 1.0 too, and it will barely move: 95.3% of sol's blocked windows
  # have lead_bps EXACTLY 0.0 because one $0.01 tick at ~$75.9 IS 1.318 bps
  # and a quiet 1m bar is perfectly flat. sol's blocker is tick quantization,
  # not the floor, and no value here fixes it.
  #
  # NEEDS A D-NUMBER. This loosens a gate that was DERIVED from a measurement,
  # which convention 17 says is the exact shape of a false positive if a win
  # rate improves afterwards. Compare against the pre-change baseline
  # deliberately, do not read an improvement as edge.
  weather:
    # Aym, 2026-08-18: price daily-extreme temperature markets.
    # DECISIONS.md, "Weather markets get a daily-extreme model, a
    # discovery cycle, and their own counters". Cited by TITLE and not
    # by D-number on purpose: convention 24, and the number this block
    # was first written against was taken by a concurrent session.
    #
    # Read `strategies/polymarket/weather_arb.py` before changing either of
    # these. `true` here does NOT mean "price a daily extreme with the
    # point-in-time model" - that combination produced the Madrid 0.000024 and
    # Buenos Aires 0.87 rows and is gone. It selects the DAILY EXTREME model:
    # max(what the station has already reported today, Normal(open-meteo's
    # forecast daily extreme + the station-minus-grid bias, sigma)).
    #
    # `backtest/measure_daily_extreme_calibration.py` EXISTS as of 2026-08-18
    # and `use_fitted_sigma` below turns its output on. What it has NOT done is
    # score this model against a RESOLVED market, because no weather position
    # has ever resolved - so every entry is still TAPE and every row is stamped
    # `daily_extreme_model_scored_on_resolved_markets: false`. The harness
    # measured the PREDICTOR's error, which is a different and weaker claim
    # than a measured win rate.
    allow_daily_extreme_markets: true
    # Price with the FITTED forecast-error sigma, per station, from
    # research/weather_sigma_calibration.json, written by
    # backtest/measure_daily_extreme_calibration.py.
    #
    # `true` means there is NO fallback: a station absent from the artifact is
    # refused under `daily_extreme_sigma_unfitted_for_station`, which is a
    # convention 11 cannot-run. That is the point. A house constant wearing a
    # fitted label is worse than a skip.
    #
    # Re-run the harness when the board lists a new city; the station universe
    # is discovered from Gamma, so a city that appeared today is not in
    # yesterday's artifact.
    use_fitted_sigma: true
    # The running observed extreme is a HARD FLOOR on the resolution value, not
    # an optional input. `true` refuses a market whose OPEN observation window
    # we could not read. A window that has not opened yet is a different fact
    # and is never refused by this: there is no floor to miss.
    require_observed_extreme: true
  strike_proxy:
    noise_floor_bps_by_asset:
      btc: 1.0
      eth: 1.0
      sol: 1.0

  # -- risk gate (engine/polymarket/risk_gate.py) --
  # On a binary the premium IS the risk: a share pays exactly $1.00 or exactly
  # $0.00, so shares * premium is simultaneously the notional and the maximum
  # loss. Every cap below is therefore USDC of premium at risk, never a stop
  # distance - none of the crypto gate's stop-based checks transfer.
  risk:
    notional_cap_usdc: 10.0                 # max premium at risk on ONE trade
    max_total_exposure_usdc: 60.0           # max premium at risk across ALL open positions (D-343 R1: delegated to engine.risk.constraints, was 100 and never bound)
    max_concurrent_positions: 10            # max open Polymarket positions at once (D-321: raised 5->10, shadow only)
    max_positions_per_market_side: 1        # stops a strategy averaging into the same side of the same market
    max_positions_per_market: 2             # 2 so a deliberate Up+Down hedge stays expressible; 1 would ban hedging
    daily_loss_limit_usdc: 0.0              # DISABLED in shadow: let strategies run to zero. Shadow is for learning, not capital preservation.
    portfolio_daily_loss_limit_usdc: 0.0    # DISABLED in shadow: no portfolio-wide stop. If the account blows up, log it, restart, keep stats.
    max_exposure_per_market_type_usdc: 40.0 # max premium at risk in any one market type (btc_5m, btc_15m, event, ...)
    market_type_exposure_overrides: {}      # per-type tighter caps, e.g. {event: 20.0}. Empty = the flat cap applies to all.
    max_correlated_exposure_usdc: 50.0      # max premium across one correlated group in one direction (BTC 5m Up + BTC 15m Up are ONE bet)
    min_premium: 0.01                       # below this a fill is noise, not a price
    max_premium: 0.99                       # 0.99 has 1c of upside and 99c of downside; out until it has its own limits
    min_shares: 5                           # exchange minimum; a budget that cannot buy it is unsizable, NOT a loss
    sizing_mode: flat                       # flat = always the per-trade cap | kelly = fractional Kelly, hard caps still bind on top
    kelly_fraction: 0.20                    # fraction of full Kelly when sizing_mode=kelly
    bankroll_usdc: 2000.0                   # Kelly bankroll; falls back to starting_equity_usdc above when unset
    taker_fee_rate: 0.0                     # falls back to the adapter's rate above when unset
    # Slug substring -> market type. Longest pattern wins, so a longer, more
    # specific pattern added later cannot be shadowed by a shorter one already
    # in the table. Anything unmatched classifies as 'event' and is still capped.
    market_type_patterns:
      btc_5m:  [btc-updown-5m, bitcoin-up-or-down-5m]
      btc_15m: [btc-updown-15m, bitcoin-up-or-down-15m]
      btc_1h:  [btc-updown-1h, bitcoin-up-or-down-1h]
      eth_5m:  [eth-updown-5m, ethereum-up-or-down-5m]
      eth_15m: [eth-updown-15m, ethereum-up-or-down-15m]
      sol_5m:  [sol-updown-5m, solana-up-or-down-5m]
    # DECLARED correlation groups, never inferred from realized correlation.
    # A market type in no group still binds, under 'ungrouped:<type>:<direction>'.
    correlation_groups:
      btc: [btc_5m, btc_15m, btc_1h]
      eth: [eth_5m, eth_15m]
      sol: [sol_5m]

notion:
  trading_journal_db: ""     # Notion database ID (fill when created)
  daily_summary_db: ""       # Notion database ID (fill when created)
  weekly_summary_db: ""      # Notion database ID (fill when created)

telegram:
  # Emergency alerts only: daily loss shutdown, engine crash, API error storm, kill switch
  enabled: true
  bot_token: ""              # Telegram bot token for emergency alerts
  chat_id: ""                # Telegram chat ID to send alerts to

logging:
  level: INFO                 # DEBUG | INFO | WARNING | ERROR
  file: logs/engine.log
  max_size_mb: 50
  backup_count: 5
